name: Purge GitHub Camo badge cache
description: >
  Resolves the Camo proxy URL for the shields.io badge in the repo README
  and sends PURGE requests to invalidate the Fastly cache.

inputs:
  github-token:
    description: "GitHub token for API access"
    required: true
  repository:
    description: "owner/repo"
    required: true

runs:
  using: composite
  steps:
    - name: Purge Camo cache for shields.io badge
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repository }}
      run: |
        # Resolve the Camo proxy URL from the rendered README.
        # 68747470733a2f2f696d672e736869656c64732e696f is the hex encoding
        # of https://img.shields.io — Camo content-addresses the source URL
        # into the proxy path.
        CAMO_URL=$(gh api "repos/$REPO/readme" \
          -H "Accept: application/vnd.github.html" \
          | grep -o 'https://camo.githubusercontent.com[^"]*68747470733a2f2f696d672e736869656c64732e696f[^"]*' | head -1)
        if [ -z "$CAMO_URL" ]; then
          echo "::warning::Could not resolve Camo URL for shields.io badge from README"
          exit 0
        fi
        echo "Camo URL: $CAMO_URL"
        # Anonymous Camo PURGE returns 200 but only clears the Fastly POP
        # that handled the request, so we repeat across multiple requests.
        for i in $(seq 1 5); do
          STATUS=$(curl -s -X PURGE "$CAMO_URL" -o /dev/null -w "%{http_code}")
          echo "PURGE attempt $i: HTTP $STATUS"
          sleep 2
        done
        echo "Camo purge complete — badge should update shortly"
