name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify tag matches pyproject.toml version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag version ($TAG) does not match pyproject.toml version ($PKG)"
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --quiet dist/*.whl
          /tmp/smoke-venv/bin/fp --help > /dev/null
          /tmp/smoke-venv/bin/fp ingest --help > /dev/null
          /tmp/smoke-venv/bin/python -c "import footprinter.mcp"
          /tmp/smoke-venv/bin/python -c "
          try:
              import footprinter.fixture
              raise SystemExit('FAIL: footprinter.fixture leaked into wheel')
          except ImportError:
              pass
          "
          echo "Wheel smoke test passed"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    if: github.event_name == 'release'
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  purge-badge-cache:
    if: github.event_name == 'release'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait for shields.io to reflect new version
        id: poll-shields
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          MAX_ATTEMPTS=12
          DELAY=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            SHIELDS_VERSION=$(curl -sf "https://img.shields.io/pypi/v/footprinter-cli.json" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])" 2>/dev/null || echo "")
            if [ "$SHIELDS_VERSION" = "$VERSION" ]; then
              echo "shields.io shows $VERSION after attempt $i"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: shields.io shows '$SHIELDS_VERSION', waiting for '$VERSION'"
            [ "$i" -lt "$MAX_ATTEMPTS" ] && sleep $DELAY
            DELAY=$((DELAY < 120 ? DELAY * 2 : 120))
          done
          echo "::warning::shields.io did not reflect $VERSION within timeout — skipping Camo purge; badge will self-heal within ~3h"

      - name: Purge GitHub Camo cache
        if: steps.poll-shields.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Anonymous Camo PURGE returns 200 but only clears the Fastly POP
          # that handled the request, so we repeat across multiple requests.
          CAMO_URL=$(gh api "repos/$REPO/readme" \
            -H "Accept: application/vnd.github.html" \
            | grep -o 'https://camo.githubusercontent.com[^"]*shields[^"]*' | head -1)
          if [ -z "$CAMO_URL" ]; then
            echo "::warning::Could not resolve Camo URL for shields.io badge from README"
            exit 0
          fi
          echo "Camo URL: $CAMO_URL"
          for i in $(seq 1 5); do
            STATUS=$(curl -s -X PURGE "$CAMO_URL" -o /dev/null -w "%{http_code}")
            echo "PURGE attempt $i: HTTP $STATUS"
            sleep 2
          done
          echo "Camo purge complete — badge should update shortly"
