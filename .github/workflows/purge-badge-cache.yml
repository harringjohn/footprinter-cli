name: Purge badge cache

on:
  workflow_dispatch:
    inputs:
      delay_minutes:
        description: "Minutes to wait before polling shields.io"
        required: false
        default: "0"
      version:
        description: "Expected PyPI version (without v prefix)"
        required: false
        default: ""

jobs:
  purge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait for delay
        if: inputs.delay_minutes != '0'
        env:
          DELAY_MINUTES: ${{ inputs.delay_minutes }}
        run: |
          echo "Sleeping for $DELAY_MINUTES minutes..."
          sleep "$((DELAY_MINUTES * 60))"

      - name: Poll shields.io
        id: poll-shields
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          MAX_ATTEMPTS=5
          DELAY=60
          for i in $(seq 1 $MAX_ATTEMPTS); do
            SHIELDS_VERSION=$(curl -sf "https://img.shields.io/pypi/v/footprinter-cli.json" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])" 2>/dev/null || echo "")
            if [ -z "$EXPECTED_VERSION" ] || [ "$SHIELDS_VERSION" = "$EXPECTED_VERSION" ]; then
              echo "shields.io shows '$SHIELDS_VERSION' (expected: '${EXPECTED_VERSION:-any}')"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: shields.io shows '$SHIELDS_VERSION', waiting for '$EXPECTED_VERSION'"
            [ "$i" -lt "$MAX_ATTEMPTS" ] && sleep $DELAY
          done
          echo "::warning::shields.io still does not reflect '$EXPECTED_VERSION' — purging anyway (badge will self-heal within ~3h)"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Purge GitHub Camo cache
        if: steps.poll-shields.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          CAMO_URL=$(gh api "repos/$REPO/readme" \
            -H "Accept: application/vnd.github.html" \
            | grep -o 'https://camo.githubusercontent.com[^"]*' | head -1)
          if [ -z "$CAMO_URL" ]; then
            echo "::warning::Could not resolve Camo URL for shields.io badge from README"
            exit 0
          fi
          echo "Camo URL: $CAMO_URL"
          for i in $(seq 1 5); do
            STATUS=$(curl -s -X PURGE "$CAMO_URL" -o /dev/null -w "%{http_code}")
            echo "PURGE attempt $i: HTTP $STATUS"
            sleep 2
          done
          echo "Camo purge complete — badge should update shortly"
