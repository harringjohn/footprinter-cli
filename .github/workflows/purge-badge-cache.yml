name: Purge badge cache

on:
  schedule:
    # Run every 4 hours. Catches stale badges after shields.io's ~3h TTL.
    # Purge is idempotent, so runs with nothing stale are harmless no-ops.
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: "Expected PyPI version (without v prefix)"
        required: false
        default: ""

jobs:
  purge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Poll shields.io
        id: poll-shields
        env:
          EXPECTED_VERSION: ${{ inputs.version || '' }}
        run: |
          MAX_ATTEMPTS=5
          DELAY=60
          for i in $(seq 1 $MAX_ATTEMPTS); do
            SHIELDS_VERSION=$(curl -sf "https://img.shields.io/pypi/v/footprinter-cli.json" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])" 2>/dev/null || echo "")
            if [ -z "$EXPECTED_VERSION" ] || [ "$SHIELDS_VERSION" = "$EXPECTED_VERSION" ]; then
              echo "shields.io shows '$SHIELDS_VERSION' (expected: '${EXPECTED_VERSION:-any}')"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: shields.io shows '$SHIELDS_VERSION', waiting for '$EXPECTED_VERSION'"
            [ "$i" -lt "$MAX_ATTEMPTS" ] && sleep $DELAY
          done
          echo "::warning::shields.io still does not reflect '$EXPECTED_VERSION' — purging anyway (badge will self-heal on next scheduled run)"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Purge GitHub Camo cache
        if: steps.poll-shields.outputs.ready == 'true'
        uses: ./.github/actions/purge-camo-badge
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
